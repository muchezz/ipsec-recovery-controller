# Example only. No production addresses or secrets.
mode: dry-run
server:
  host: 127.0.0.1
  port: 8765
gateways:
  gateway-01:
    transport: ssh # default; old v0.2.0 files work without this line
    host: 192.0.2.10
    ssh_user: ipsec-controller
    ssh_port: 22
    ssh_identity_file: /etc/ipsec-recovery-controller/ssh/id_ed25519
    ssh_known_hosts_file: /etc/ipsec-recovery-controller/ssh/known_hosts
    ssh_timeout_seconds: 10
    adapter: auto
connections:
  partner-01:
    gateway: gateway-01
    ike_connection: partner-ike
    child_connection: partner-ike
    # Optional when several CHILD SAs share the same legacy connection name:
    # local_selector: 10.0.0.0/24
    # remote_selector: 10.1.0.0/24
    recovery_enabled: false
alerts:
  - name: ExampleIPsecTunnelMissing
    connection: partner-01
    match_labels:
      peer: example-partner
