# Optional: install only for inspection_backend: helper.
[Unit]
Requires=ipsec-recovery-diagnostics-helper.socket
After=ipsec-recovery-diagnostics-helper.socket

[Service]
# Prevent direct stroke access even if host permissions are accidentally relaxed.
# Override for a distribution using a different charon control socket location.
InaccessiblePaths=-/run/charon.ctl
