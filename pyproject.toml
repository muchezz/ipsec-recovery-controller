[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ipsec-recovery-controller"
version = "0.3.0"
description = "Safe, policy-driven Alertmanager IPsec recovery evaluation controller"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "prometheus-client>=0.20,<1", "httpx>=0.27,<1", "cryptography>=43,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
ipsec-recovery-controller = "ipsec_recovery_controller.main:main"
ipsec-recovery-agent = "ipsec_recovery_controller.agent.cli:main"

ipsec-recovery-diagnostics-helper = "ipsec_recovery_controller.helper.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ipsec_recovery_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
